# Reference deployment: API behind nginx with TLS 1.3 + PostgreSQL + Redis.
# Put secrets in a .env file (outside git); sample keys are in docs/OPERATIONS.md.
services:
  api:
    build: .
    environment:
      IPIND_JWT_SECRET: ${IPIND_JWT_SECRET:?not set}
      IPIND_ENCRYPTION_KEY: ${IPIND_ENCRYPTION_KEY:?not set}
      IPIND_DATABASE_URL: postgresql+psycopg2://ipind:${POSTGRES_PASSWORD:?not set}@db:5432/ipind2
      IPIND_REDIS_URL: redis://redis:6379/0
      IPIND_MODEL_DIR: /models
    volumes:
      - ./models/current:/models:ro
    depends_on: [db, redis]
    expose: ["8000"]
  proxy:
    image: nginx:1.27-alpine
    ports: ["443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ipind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?not set}
      POSTGRES_DB: ipind2
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
volumes:
  pgdata:
